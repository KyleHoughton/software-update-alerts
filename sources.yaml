# Sources the hourly checker watches.
#
# type:
#   rss            RSS or Atom feed. Optional "exclude_titles" / "include_titles" (lists of regex) filter items by title.
#   github_release Latest releases of a GitHub repository ("repo: owner/name").
#   cisa_kev       CISA Known Exploited Vulnerabilities (any software). Always urgent.
#   nvd            New CVEs from the US National Vulnerability Database, matched to "vendors" below.
#   page_watch     A web page with no feed. Alerts when new text appears on it.
#
# category: "security" or "update". Decides the email section.
# To add a source, copy an entry and change it. The id must be unique.

vulnerabilities:
  cisa_kev:
    name: CISA Known Exploited Vulnerabilities (all software)
    type: cisa_kev
    category: security
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

  nvd:
    name: NVD new CVEs for watched vendors
    type: nvd
    category: security
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    urgent_cvss: 9.0   # CVEs at or above this score are marked urgent

  msrc:
    name: Microsoft Security Update Guide
    type: rss
    category: security
    url: https://api.msrc.microsoft.com/update-guide/rss

  fortinet_psirt:
    name: Fortinet PSIRT advisories
    type: rss
    category: security
    url: https://filestore.fortinet.com/fortiguard/rss/ir.xml

# Vendors matched against new CVEs in NVD. "cpe" is the NVD vendor id, "keywords" are
# matched (whole words, any case) in the CVE description. Microsoft is left out here
# because the Microsoft Security Update Guide feed above already covers it.
vendors:
  - {name: Quest, cpe: [quest], keywords: ["Quest Software", "Quest KACE", "Change Auditor", "GPOADmin", "Recovery Manager for Active Directory", "On Demand Migration"]}
  - {name: One Identity, cpe: [oneidentity], keywords: ["One Identity", "Safeguard for Privileged", "Active Roles", "Cloud PAM Essentials"]}
  - {name: CrowdStrike, cpe: [crowdstrike], keywords: ["CrowdStrike", "Falcon sensor"]}
  - {name: Delinea, cpe: [delinea, thycotic], keywords: ["Delinea", "Thycotic", "Secret Server", "Privilege Manager"]}
  - {name: Netwrix, cpe: [netwrix], keywords: ["Netwrix", "PingCastle", "PolicyPak", "Password Policy Enforcer"]}
  - {name: Semperis, cpe: [semperis], keywords: ["Semperis", "Purple Knight", "Directory Services Protector"]}
  - {name: SpecterOps, cpe: [specterops], keywords: ["BloodHound", "SpecterOps"]}
  - {name: Silverfort, cpe: [silverfort], keywords: ["Silverfort"]}
  - {name: RSA, cpe: [rsa, dell], keywords: ["RSA SecurID", "RSA Governance", "RSA Authentication Manager", "RSA ID Plus"]}
  - {name: Fortinet, cpe: [fortinet], keywords: ["Fortinet", "FortiOS", "FortiGate", "FortiPAM", "FortiMail", "FortiAuthenticator", "FortiSIEM", "FortiSOAR", "FortiNAC", "FortiEDR", "FortiProxy", "FortiWeb"]}
  - {name: Fortra, cpe: [fortra, helpsystems], keywords: ["Fortra", "GoAnywhere", "Tripwire", "Cobalt Strike", "Digital Guardian", "Core Impact"]}
  - {name: Proofpoint, cpe: [proofpoint], keywords: ["Proofpoint"]}
  - {name: Mimecast, cpe: [mimecast], keywords: ["Mimecast", "Code42", "Incydr"]}
  - {name: Coro, cpe: [coro], keywords: ["Coro Cyber"]}
  - {name: Libraesva, cpe: [libraesva], keywords: ["Libraesva"]}
  - {name: HYPR, cpe: [hypr], keywords: ["HYPR"]}
  - {name: Yubico, cpe: [yubico], keywords: ["Yubico", "YubiKey", "YubiHSM"]}
  - {name: BIO-key, cpe: [bio-key], keywords: ["BIO-key", "PortalGuard"]}
  - {name: Commvault, cpe: [commvault], keywords: ["Commvault"]}
  - {name: Veeam, cpe: [veeam], keywords: ["Veeam"]}
  - {name: BitTitan, cpe: [bittitan], keywords: ["BitTitan", "MigrationWiz"]}
  - {name: ShareGate, cpe: [sharegate], keywords: ["ShareGate"]}
  - {name: Cequence, cpe: [cequence], keywords: ["Cequence"]}
  - {name: Deep Instinct, cpe: [deepinstinct], keywords: ["Deep Instinct"]}
  - {name: Progress Kemp, cpe: [kemptechnologies, progress], keywords: ["LoadMaster", "Flowmon", "Progress Kemp"]}
  - {name: Ground Labs, cpe: [groundlabs], keywords: ["Ground Labs", "Enterprise Recon"]}
  - {name: Patch My PC, cpe: [patchmypc], keywords: ["Patch My PC"]}
  - {name: PaperCut, cpe: [papercut], keywords: ["PaperCut"]}
  - {name: SonicWall, cpe: [sonicwall], keywords: ["SonicWall", "SonicOS", "SMA100", "SMA 100"]}
  - {name: Anthropic, cpe: [anthropic], keywords: ["Anthropic", "Claude Code"]}

