name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; software-update-alerts/1.0)"
          for u in https://status.cloud.oneidentity.com/history.rss https://status.cloud.oneidentity.com/history.atom https://docs.oneidentity.com/ https://docs.oneidentity.com/bundle/active-roles https://docs.oneidentity.com/search/all?query=release%20notes; do
            r=$(curl -sL -A "$UA" -o f.xml -w '%{http_code} %{content_type} %{url_effective} %{size_download}' "$u")
            echo "RES $u -> $r"; grep -oE '<title>[^<]{0,120}' f.xml | head -5 | sed 's/^/  ITEM /'
            grep -oE 'href="[^"]*(release|active-roles|safeguard|defender|bundle)[^"]*"' f.xml | sort -u | head -25 | sed 's/^/  LINK /'
          done
