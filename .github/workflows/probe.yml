name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; software-update-alerts/1.0)"
          for u in https://support.oneidentity.com/feed https://support.oneidentity.com/comments/feed https://support.oneidentity.com/product-notification/feed https://www.oneidentity.com/feed/ https://support.oneidentity.com/wp-json/wp/v2/types https://support.oneidentity.com/sitemap.xml https://support.oneidentity.com/wp-sitemap.xml; do
            r=$(curl -sL -A "$UA" -o f.xml -w '%{http_code} %{content_type} %{url_effective}' "$u")
            echo "RES $u -> $r"; grep -oE '<(title|loc)>[^<]{0,120}' f.xml | head -12 | sed 's/^/  ITEM /'; head -c 300 f.xml | tr '\n' ' ' | sed 's/^/  HEAD /'; echo
          done
          curl -sL -A "$UA" https://support.oneidentity.com/ -o home.html; grep -oE 'href="[^"]+"' home.html | sort -u | head -100 | sed 's/^/LINK /'
