name: Temporary monthly report preview (dev)
on:
  push:
    branches: ["claude/project-thread-9r2ekb"]
    paths: [".github/workflows/dev-preview.yml", "checker/monthly.py"]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p devpreview
          REPORT_MODE=patch PREVIEW_ONLY=true python checker/monthly.py 2>&1 | tee devpreview/run-log.txt
          mv monthly-report.html devpreview/preview-patch.html
          python - <<'PY' | tee devpreview/link-check.txt
          import re, requests
          h = open("devpreview/preview-patch.html").read()
          for u in sorted(set(re.findall(r'href="(https?://[^"]+)"', h))):
              try:
                  r = requests.get(u.replace("&amp;", "&"), timeout=30, headers={"User-Agent": "Mozilla/5.0"})
                  print(r.status_code, u)
              except Exception as e:
                  print("ERR", u, e)
          PY
          for kb in 5132748 5132747; do curl -sSL -A "Mozilla/5.0" -o devpreview/gdr-$kb.html "$(grep -o "https://[^\"]*kb$kb[^\"]*" devpreview/preview-patch.html | head -1)"; done
      - run: |
          git config user.name "update-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devpreview && git commit -q -m "Dev: monthly preview [skip ci]" && git push
