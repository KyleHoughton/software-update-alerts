name: Temporary page fetch (dev)
on:
  push:
    branches: ["claude/project-thread-9r2ekb"]
    paths: [".github/workflows/dev-fetch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p devfetch && cd devfetch
          L=https://learn.microsoft.com/en-us/windows/release-health
          f() { curl -sSL -A "Mozilla/5.0" -o "$1" "$2" || echo "FAILED $2"; ls -la "$1"; }
          f w11-info.html $L/windows11-release-information
          f w10-info.html $L/release-information
          f rh-index.html $L/
          for p in status-windows-11-26h2 status-windows-11-26h1 status-windows-11-25h2 status-windows-11-24h2 status-windows-11-23h2 status-windows-10-22h2 status-windows-10-21h2; do f $p.html $L/$p; done
      - run: |
          git config user.name "update-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devfetch && git commit -q -m "Dev: fetched pages [skip ci]" && git push
