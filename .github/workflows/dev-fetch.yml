name: Temporary monthly report preview (dev)
on:
  push:
    branches: ["claude/project-thread-9r2ekb"]
    paths: [".github/workflows/dev-fetch.yml", "checker/monthly.py"]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p devfetch
          curl -sSL -A "Mozilla/5.0" -o devfetch/sql-cu28.html https://learn.microsoft.com/en-us/help/5125472
          curl -sSL -A "Mozilla/5.0" -o devfetch/sql-cu11.html https://learn.microsoft.com/en-us/help/5129223
          REPORT_MODE=patch PREVIEW_ONLY=true python checker/monthly.py
          mv monthly-report.html devfetch/preview-patch.html
      - run: |
          git config user.name "update-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devfetch && git commit -q -m "Dev: monthly preview [skip ci]" && git push
