name: Hourly update check

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past (UTC)
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email even if nothing is new"
        type: boolean
        default: false
      send_sample_email:
        description: "Send a SAMPLE email with the latest real items from every source"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # lets the job sign in to Microsoft Entra without a secret

concurrency:
  group: update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and email the group
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
          SEND_SAMPLE_EMAIL: ${{ inputs.send_sample_email }}
        run: python checker/main.py

      - name: Publish the sample report to the sample-preview branch
        if: ${{ inputs.send_sample_email == true }}
        run: |
          mkdir -p /tmp/preview && cp sample-report.html /tmp/preview/index.html
          cd /tmp/preview
          git init -q -b sample-preview
          git config user.name "update-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -q -m "Sample report preview"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sample-preview

      - name: Save what has been seen
        if: ${{ inputs.send_sample_email != true }}
        run: |
          git config user.name "update-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "No state changes"; exit 0; fi
          git commit -m "Update seen items [skip ci]"
          git push
