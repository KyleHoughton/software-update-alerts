name: Twice-daily update report

on:
  schedule:
    - cron: "7,27,47 4,5 * * *"   # 06:07-07:47 SAST, first run sends
    - cron: "47 15 * * *"         # 17:47 SAST
    - cron: "7,27,47 16 * * *"    # 18:07-18:47 SAST
  workflow_dispatch:
    inputs:
      send_report:
        description: "Run and send the full report now, exactly like a scheduled run"
        type: boolean
        default: false
      send_test_email:
        description: "Send a test email even if nothing is new"
        type: boolean
        default: false
      send_sample_email:
        description: "Send a SAMPLE email with the latest real items from every source"
        type: boolean
        default: false
      send_all_ok_sample:
        description: "Send a SAMPLE of the quiet 'All OK' report"
        type: boolean
        default: false
      send_image_test:
        description: "Send one short email that tests how the logo is displayed"
        type: boolean
        default: false
      preview_only:
        description: "With the sample option: build the preview only, don't email it"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # lets the job sign in to Microsoft Entra without a secret

concurrency:
  group: update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and email the group
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
          SEND_SAMPLE_EMAIL: ${{ inputs.send_sample_email }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
          SEND_ALL_OK_SAMPLE: ${{ inputs.send_all_ok_sample }}
          SEND_IMAGE_TEST: ${{ inputs.send_image_test }}
          SEND_REPORT: ${{ inputs.send_report }}
        run: python checker/main.py

      - name: Publish the sample report to the sample-preview branch
        if: ${{ inputs.send_sample_email == true }}
        run: |
          mkdir -p /tmp/preview && cp sample-report.html /tmp/preview/index.html
          cd /tmp/preview
          git init -q -b sample-preview
          git config user.name "update-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -q -m "Sample report preview"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sample-preview

      - name: Save what has been seen
        if: ${{ inputs.send_sample_email != true && inputs.send_all_ok_sample != true && inputs.send_image_test != true }}
        run: |
          git config user.name "update-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "No state changes"; exit 0; fi
          git commit -m "Update seen items [skip ci]"
          git push
